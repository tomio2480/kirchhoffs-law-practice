<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>キルヒホッフの法則 練習問題</title>
    <style>
        body { font-family: sans-serif; margin: 2em; }
        .container { max-width: 800px; margin: auto; }
        .input-group { margin-bottom: 2em; }
        .input-row { display: flex; justify-content: space-around; }
        .input-row div { margin: 0 1em; }
        #circuit-diagram { border: 1px solid #ccc; padding: 1em; text-align: center; }
        #circuit-diagram svg { max-width: 100%; height: auto; }
        #solution { margin-top: 2em; }
        pre { background-color: #f4f4f4; padding: 1em; border-radius: 5px; }
        .circuit-element { font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>キルヒホッフの法則 練習問題</h1>
        <p>電源電圧 (E) と抵抗値 (R) を入力して、各抵抗を流れる電流を求めましょう。</p>
        
        <div class="input-group">
            <div class="input-row">
                <div>
                    <label for="e1">E₁ (V):</label>
                    <input type="number" id="e1" value="10">
                </div>
                <div>
                    <label for="e2">E₂ (V):</label>
                    <input type="number" id="e2" value="15">
                </div>
                <div>
                    <label for="e3">E₃ (V):</label>
                    <input type="number" id="e3" value="20">
                </div>
            </div>
            <div class="input-row">
                <div>
                    <label for="r1">R₁ (Ω):</label>
                    <input type="number" id="r1" value="2">
                </div>
                <div>
                    <label for="r2">R₂ (Ω):</label>
                    <input type="number" id="r2" value="3">
                </div>
                <div>
                    <label for="r3">R₃ (Ω):</label>
                    <input type="number" id="r3" value="4">
                </div>
            </div>
            <button onclick="calculateAndDraw()">計算と作図</button>
        </div>

        <div id="circuit-diagram">
            </div>

        <div id="solution">
            </div>
    </div>

    <script>
        function calculateAndDraw() {
            const e1 = parseFloat(document.getElementById('e1').value);
            const e2 = parseFloat(document.getElementById('e2').value);
            const e3 = parseFloat(document.getElementById('e3').value);
            const r1 = parseFloat(document.getElementById('r1').value);
            const r2 = parseFloat(document.getElementById('r2').value);
            const r3 = parseFloat(document.getElementById('r3').value);

            // 回路図のSVGを生成
            const diagramDiv = document.getElementById('circuit-diagram');
            diagramDiv.innerHTML = `
                <svg width="700" height="350" viewBox="0 0 700 350">
                    <style>
                        .loop-path { fill: none; stroke: blue; stroke-width: 2; stroke-dasharray: 5,5; }
                        .loop-text { fill: blue; font-size: 16px; font-weight: bold; }
                    </style>
                    <defs>
                        <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
                            <polygon points="0 0, 10 3.5, 0 7" fill="red" />
                        </marker>
                    </defs>

                    <line x1="50" y1="50" x2="650" y2="50" stroke="black" stroke-width="2" />
                    <line x1="50" y1="200" x2="650" y2="200" stroke="black" stroke-width="2" />

                    <g transform="translate(0,0)">
                        <text x="60" y="30" font-size="18">E₁ = ${e1}V</text>
                        <text x="60" y="100" font-size="18">R₁ = ${r1}Ω</text>
                        <line x1="100" y1="50" x2="100" y2="80" stroke="black" stroke-width="2" />
                        <line x1="90" y1="80" x2="110" y2="80" stroke="black" stroke-width="2" />
                        <line x1="90" y1="90" x2="110" y2="90" stroke="black" stroke-width="2" />
                        <rect x="75" y="110" width="50" height="20" stroke="black" fill="none" stroke-width="2" />
                        <line x1="100" y1="130" x2="100" y2="200" stroke="black" stroke-width="2" />
                        <text x="110" y="160" font-size="18" fill="red">I₁</text>
                        <line x1="110" y1="150" x2="110" y2="160" stroke="red" stroke-width="2" marker-end="url(#arrowhead)"/>
                    </g>

                    <g transform="translate(200,0)">
                        <text x="60" y="30" font-size="18">E₂ = ${e2}V</text>
                        <text x="60" y="100" font-size="18">R₂ = ${r2}Ω</text>
                        <line x1="100" y1="50" x2="100" y2="80" stroke="black" stroke-width="2" />
                        <line x1="90" y1="80" x2="110" y2="80" stroke="black" stroke-width="2" />
                        <line x1="90" y1="90" x2="110" y2="90" stroke="black" stroke-width="2" />
                        <rect x="75" y="110" width="50" height="20" stroke="black" fill="none" stroke-width="2" />
                        <line x1="100" y1="130" x2="100" y2="200" stroke="black" stroke-width="2" />
                        <text x="110" y="160" font-size="18" fill="red">I₂</text>
                        <line x1="110" y1="150" x2="110" y2="160" stroke="red" stroke-width="2" marker-end="url(#arrowhead)"/>
                    </g>

                    <g transform="translate(400,0)">
                        <text x="60" y="30" font-size="18">E₃ = ${e3}V</text>
                        <text x="60" y="100" font-size="18">R₃ = ${r3}Ω</text>
                        <line x1="100" y1="50" x2="100" y2="80" stroke="black" stroke-width="2" />
                        <line x1="90" y1="80" x2="110" y2="80" stroke="black" stroke-width="2" />
                        <line x1="90" y1="90" x2="110" y2="90" stroke="black" stroke-width="2" />
                        <rect x="75" y="110" width="50" height="20" stroke="black" fill="none" stroke-width="2" />
                        <line x1="100" y1="130" x2="100" y2="200" stroke="black" stroke-width="2" />
                        <text x="110" y="160" font-size="18" fill="red">I₃</text>
                        <line x1="110" y1="150" x2="110" y2="160" stroke="red" stroke-width="2" marker-end="url(#arrowhead)"/>
                    </g>

                    <path d="M100,50 L200,50 L200,200 L100,200 Z" class="loop-path" />
                    <text x="150" y="125" class="loop-text">閉回路1</text>
                    
                    <path d="M300,50 L400,50 L400,200 L300,200 Z" class="loop-path" />
                    <text x="350" y="125" class="loop-text">閉回路2</text>

                </svg>
            `;

            // JavaScriptで計算を実行 (節点解析法)
            const sum_e_div_r = (e1/r1) + (e2/r2) + (e3/r3);
            const sum_1_div_r = (1/r1) + (1/r2) + (1/r3);
            
            // 節点電位 V_A の計算
            const V_A = sum_e_div_r / sum_1_div_r;

            // 各枝路の電流を計算
            let i1 = (e1 - V_A) / r1;
            let i2 = (e2 - V_A) / r2;
            let i3 = (e3 - V_A) / r3;

            // 丸め処理
            i1 = isFinite(i1) ? i1.toFixed(2) : 'Infinity';
            i2 = isFinite(i2) ? i2.toFixed(2) : 'Infinity';
            i3 = isFinite(i3) ? i3.toFixed(2) : 'Infinity';

            const solutionDiv = document.getElementById('solution');
            solutionDiv.innerHTML = `
                <h2>解答</h2>
                <pre>
                    キルヒホッフの法則に基づく計算:
                    節点電位 V_A = (${e1}/${r1} + ${e2}/${r2} + ${e3}/${r3}) / (1/${r1} + 1/${r2} + 1/${r3}) = ${V_A.toFixed(2)}V

                    I₁ = (E₁ - V_A) / R₁ = (${e1} - ${V_A.toFixed(2)}) / ${r1} = ${i1}A
                    I₂ = (E₂ - V_A) / R₂ = (${e2} - ${V_A.toFixed(2)}) / ${r2} = ${i2}A
                    I₃ = (E₃ - V_A) / R₃ = (${e3} - ${V_A.toFixed(2)}) / ${r3} = ${i3}A
                </pre>
            `;
        }
    </script>
</body>
</html>
