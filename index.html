<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>キルヒホッフの法則 練習問題</title>
    <style>
        body { font-family: sans-serif; margin: 2em; }
        .container { max-width: 800px; margin: auto; }
        .input-group { margin-bottom: 2em; }
        .input-row { display: flex; justify-content: space-around; }
        .input-row div { margin: 0 1em; }
        #circuit-diagram { border: 1px solid #ccc; padding: 1em; text-align: center; }
        #circuit-diagram svg { max-width: 100%; height: auto; }
        #solution { margin-top: 2em; }
        pre { background-color: #f4f4f4; padding: 1em; border-radius: 5px; }
        .circuit-element { font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>キルヒホッフの法則 練習問題</h1>
        <p>電源電圧 (E) と抵抗値 (R) を入力して、各抵抗を流れる電流を求めましょう。</p>
        
        <div class="input-group">
            <div class="input-row">
                <div>
                    <label for="e1">E₁ (V):</label>
                    <input type="number" id="e1" value="10">
                </div>
                <div>
                    <label for="e2">E₂ (V):</label>
                    <input type="number" id="e2" value="15">
                </div>
                <div>
                    <label for="e3">E₃ (V):</label>
                    <input type="number" id="e3" value="20">
                </div>
            </div>
            <div class="input-row">
                <div>
                    <label for="r1">R₁ (Ω):</label>
                    <input type="number" id="r1" value="2">
                </div>
                <div>
                    <label for="r2">R₂ (Ω):</label>
                    <input type="number" id="r2" value="3">
                </div>
                <div>
                    <label for="r3">R₃ (Ω):</label>
                    <input type="number" id="r3" value="4">
                </div>
            </div>
            <button onclick="calculateAndDraw()">計算と作図</button>
        </div>

        <div id="circuit-diagram">
            </div>

        <div id="solution">
            </div>
    </div>

    <script>
        function calculateAndDraw() {
            const e1 = parseFloat(document.getElementById('e1').value);
            const e2 = parseFloat(document.getElementById('e2').value);
            const e3 = parseFloat(document.getElementById('e3').value);
            const r1 = parseFloat(document.getElementById('r1').value);
            const r2 = parseFloat(document.getElementById('r2').value);
            const r3 = parseFloat(document.getElementById('r3').value);

            // 回路図のSVGを生成
            const diagramDiv = document.getElementById('circuit-diagram');
            diagramDiv.innerHTML = `
                <svg width="600" height="300" viewBox="0 0 600 300">
                    <g transform="translate(0,0)">
                        <line x1="50" y1="50" x2="50" y2="70" stroke="black" stroke-width="2" />
                        <line x1="40" y1="60" x2="60" y2="60" stroke="black" stroke-width="2" /> <line x1="45" y1="65" x2="55" y2="65" stroke="black" stroke-width="2" /> <text x="65" y="60" font-size="18">E₁ = ${e1}V</text>
                        
                        <rect x="25" y="90" width="50" height="20" stroke="black" fill="none" stroke-width="2" />
                        <text x="78" y="105" font-size="14">R₁ = ${r1}Ω</text>

                        <line x1="50" y1="120" x2="50" y2="150" stroke="red" stroke-width="2" marker-end="url(#arrowhead)"/>
                        <text x="60" y="135" fill="red" font-size="14">I₁</text>
                    </g>

                    <g transform="translate(200,0)">
                        <line x1="50" y1="50" x2="50" y2="70" stroke="black" stroke-width="2" />
                        <line x1="40" y1="60" x2="60" y2="60" stroke="black" stroke-width="2" />
                        <line x1="45" y1="65" x2="55" y2="65" stroke="black" stroke-width="2" />
                        <text x="65" y="60" font-size="18">E₂ = ${e2}V</text>

                        <rect x="25" y="90" width="50" height="20" stroke="black" fill="none" stroke-width="2" />
                        <text x="78" y="105" font-size="14">R₂ = ${r2}Ω</text>

                        <line x1="50" y1="120" x2="50" y2="150" stroke="red" stroke-width="2" marker-end="url(#arrowhead)"/>
                        <text x="60" y="135" fill="red" font-size="14">I₂</text>
                    </g>

                    <g transform="translate(400,0)">
                        <line x1="50" y1="50" x2="50" y2="70" stroke="black" stroke-width="2" />
                        <line x1="40" y1="60" x2="60" y2="60" stroke="black" stroke-width="2" />
                        <line x1="45" y1="65" x2="55" y2="65" stroke="black" stroke-width="2" />
                        <text x="65" y="60" font-size="18">E₃ = ${e3}V</text>

                        <rect x="25" y="90" width="50" height="20" stroke="black" fill="none" stroke-width="2" />
                        <text x="78" y="105" font-size="14">R₃ = ${r3}Ω</text>

                        <line x1="50" y1="120" x2="50" y2="150" stroke="red" stroke-width="2" marker-end="url(#arrowhead)"/>
                        <text x="60" y="135" fill="red" font-size="14">I₃</text>
                    </g>
                    
                    <line x1="50" y1="50" x2="450" y2="50" stroke="black" stroke-width="2" />
                    <line x1="50" y1="150" x2="450" y2="150" stroke="black" stroke-width="2" />

                    <defs>
                        <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
                            <polygon points="0 0, 10 3.5, 0 7" fill="red" />
                        </marker>
                    </defs>
                </svg>
            `;

            // JavaScriptで計算を実行
            let i1 = e1 / r1;
            let i2 = e2 / r2;
            let i3 = e3 / r3;

            // 無限大のチェックと丸め処理
            i1 = isFinite(i1) ? i1.toFixed(2) : 'Infinity';
            i2 = isFinite(i2) ? i2.toFixed(2) : 'Infinity';
            i3 = isFinite(i3) ? i3.toFixed(2) : 'Infinity';

            const solutionDiv = document.getElementById('solution');
            solutionDiv.innerHTML = `
                <h2>解答</h2>
                <pre>
                    I₁ = E₁ / R₁ = ${e1}V / ${r1}Ω = ${i1}A
                    I₂ = E₂ / R₂ = ${e2}V / ${r2}Ω = ${i2}A
                    I₃ = E₃ / R₃ = ${e3}V / ${r3}Ω = ${i3}A
                </pre>
            `;
        }
    </script>
</body>
</html>
